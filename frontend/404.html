<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The requested page could not be found on the Katok Kalinis municipal environmental management portal.">
    <title>Page Not Found | Katok Kalinis</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: var(--bg);
            box-sizing: border-box;
        }
        .error-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 44px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-illustration {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface-alt);
            color: var(--green-600);
            border: 2px solid var(--border);
        }
        .error-code {
            font-size: 54px;
            font-weight: 800;
            line-height: 1;
            color: var(--green-700);
            letter-spacing: -2px;
            margin-bottom: 8px;
        }
        .error-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
        }
        .error-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .error-btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--green-600), var(--green-700));
            color: #ffffff;
            border: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            min-height: 44px;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }
        .error-btn-primary:hover {
            background: linear-gradient(135deg, var(--green-700), var(--green-800));
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35);
        }
        .error-btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 20px;
            background: var(--surface-alt);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            min-height: 44px;
            transition: background 0.15s ease;
        }
        .error-btn-secondary:hover {
            background: var(--border);
        }
        .error-brand-badge {
            margin-bottom: 18px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="error-page-container">
        <div class="error-card">
            <div class="error-brand-badge brand-dark-on-light" style="display:inline-flex; align-items:center;">
                <img src="img/katok-logo-full.png" alt="KatokKalinis" class="footer-logo-img" style="height:26px; width:auto; margin-right:6px;">
                <span class="brand-katok">Katok</span><span class="brand-kalinisan">Kalinis</span>
            </div>
            
            <div class="error-illustration" aria-hidden="true">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
            </div>

            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">
                The resource or dashboard route you requested does not exist, has been moved, or the link may be outdated.
            </p>

            <div class="error-actions">
                <button type="button" class="error-btn-primary" id="btn-back-dashboard" onclick="goToDashboard()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Dashboard
                </button>
                <a href="login.html" class="error-btn-secondary">Go to Login</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function goToDashboard() {
            const token = localStorage.getItem('auth_token');
            const role = getUserRole();
            if (token && role) {
                window.location.href = getHomePage(role);
            } else {
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
