<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Logs - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-bar input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .action-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: #ecf0f1;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2>History Logs for Activities</h2>
                <div id="topbar-user"></div>
            </header>

            <section class="content">
                <div class="exec-command-center">
                    <!-- Standard Executive Header Banner (Image 3 Template) -->
                    <div class="exec-header-banner">
                        <div class="exec-header-left">
                            <div class="exec-shield-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                                </svg>
                            </div>
                            <div class="exec-header-title-wrap">
                                <div class="exec-header-title-row">
                                    <h2>Security Audit &amp; Activity Ledger</h2>
                                    <span class="exec-clenro-pill">AUDIT LOGGING LIVE</span>
                                </div>
                                <p class="exec-header-subtitle">Compliance Logs &bull; Admin Actions &amp; Dispatch Timestamps &bull; Cagayan de Oro City</p>
                            </div>
                        </div>
                        <div class="exec-header-right">
                            <button type="button" class="exec-btn-brief" onclick="loadData()">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                                Refresh Logs
                            </button>
                        </div>
                    </div>

                <div class="card">
                    <div class="card-header">
                        <h3>System Audit Trail</h3>
                    </div>
                    <div class="filter-bar">
                        <input type="text" id="search-box" placeholder="Search action or description...">
                        <input type="date" id="date-from">
                        <input type="date" id="date-to">
                        <button class="btn" onclick="loadData()" style="width: auto;">Filter</button>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Date/Time</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        const endpoint = '/activity-logs';

        async function loadData() {
            const tbody = document.getElementById('table-body');
            const search = document.getElementById('search-box').value;
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;

            let query = [];
            if (search) query.push(`search=${encodeURIComponent(search)}`);
            if (dateFrom) query.push(`date_from=${encodeURIComponent(dateFrom)}`);
            if (dateTo) query.push(`date_to=${encodeURIComponent(dateTo)}`);
            const qs = query.length ? `?${query.join('&')}` : '';

            try {
                const res = await apiRequest(endpoint + qs);
                const data = res.logs || [];

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No activity recorded.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.created_at ? item.created_at.substring(0, 19).replace('T', ' ') : '-'}</td>
                        <td>${(item.user && item.user.name) || 'System'}</td>
                        <td><span class="action-tag">${item.action}</span></td>
                        <td>${item.description || '-'}</td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5">Error loading data: ${error.message}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
