<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Activity &amp; Audit Logs | Katok Kalinis</title>
    <meta name="description" content="Review administrative activity history, security events, database changes, and system audit trails for Katok Kalinis waste operations.">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#166534">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-bar input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font-size: 13.5px;
        }
        .filter-bar input[type="text"] { flex: 1; min-width: 220px; }
        .action-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--surface-alt);
            color: var(--text);
            font-family: monospace;
            font-size: 12px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2>History Logs for Activities</h2>
                <div id="topbar-user"></div>
            </header>

            <section class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>System Audit Trail</h3>
                    </div>
                    <div class="filter-bar">
                        <input type="text" id="search-box" placeholder="Search action or description...">
                        <input type="date" id="date-from">
                        <input type="date" id="date-to">
                        <button class="btn" onclick="loadData()" style="width: auto;">Filter</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Date/Time</th>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr><td colspan="5">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        const endpoint = '/activity-logs';

        async function loadData() {
            const tbody = document.getElementById('table-body');
            const search = document.getElementById('search-box').value;
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;

            let query = [];
            if (search) query.push(`search=${encodeURIComponent(search)}`);
            if (dateFrom) query.push(`date_from=${encodeURIComponent(dateFrom)}`);
            if (dateTo) query.push(`date_to=${encodeURIComponent(dateTo)}`);
            const qs = query.length ? `?${query.join('&')}` : '';

            try {
                const res = await apiRequest(endpoint + qs);
                const data = res.logs || [];

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px;">No activity recorded.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.created_at ? item.created_at.substring(0, 19).replace('T', ' ') : '-'}</td>
                        <td><strong>${escapeHtml((item.user && item.user.name) || 'System')}</strong></td>
                        <td><span class="action-tag">${escapeHtml(item.action)}</span></td>
                        <td>${escapeHtml(item.description || '-')}</td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #b91c1c; padding: 20px;">Error loading data: ${escapeHtml(error.message)}</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
