<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Attendance</h2>
                <div id="topbar-user"></div>
            </header>
            
            <section class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Attendance Log</h3>
                        <button class="btn" onclick="openModal()" style="width: auto;">Add Attendance</button>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Employee</th>
                                <th>Date</th>
                                <th>Time In</th>
                                <th>Time Out</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="7">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Add Attendance Modal -->
    <div id="form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Attendance</h3>
                <span class="close-btn" onclick="closeFormModal()">&times;</span>
            </div>
            <form id="data-form">
                <div class="form-group">
                    <label>Employee</label>
                    <select id="user_id" class="form-control" required>
                        <option value="">-- Select Employee --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Time In</label>
                    <input type="time" id="time_in" class="form-control">
                </div>
                <div class="form-group">
                    <label>Time Out</label>
                    <input type="time" id="time_out" class="form-control">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="add-status-select" class="form-control">
                        <option value="present">Present</option>
                        <option value="late">Late</option>
                        <option value="absent">Absent</option>
                        <option value="on_leave">On Leave</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Remarks</label>
                    <input type="text" id="remarks" class="form-control">
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>

    <!-- Update Status Modal -->
    <div id="status-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Update Attendance Status</h3>
                <span class="close-btn" onclick="closeStatusModal()">&times;</span>
            </div>
            <form id="status-form">
                <input type="hidden" id="attendance-id">
                <div class="form-group">
                    <label>Status</label>
                    <select id="status-select" class="form-control">
                        <option value="present">Present</option>
                        <option value="late">Late</option>
                        <option value="absent">Absent</option>
                        <option value="on_leave">On Leave</option>
                    </select>
                </div>
                <button type="submit" class="btn">Update Status</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const endpoint = '/attendance';
        let employees = [];

        async function loadEmployees() {
            try {
                const res = await apiRequest('/users?role=driver').catch(() => ({ users: [] }));
                employees = res.users || [];
                const select = document.getElementById('user_id');
                employees.forEach(emp => {
                    const opt = document.createElement('option');
                    opt.value = emp.id;
                    opt.textContent = `${emp.name} (${emp.email})`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('Failed to load employees', error);
            }
        }

        async function loadData() {
            const tbody = document.getElementById('table-body');
            try {
                const res = await apiRequest(endpoint);
                const data = res.attendance || [];

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">No attendance records found.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr>
                        <td>${item.id}</td>
                        <td>${(item.user && item.user.name) || '-'}</td>
                        <td>${item.date ? item.date.substring(0, 10) : '-'}</td>
                        <td>${item.time_in || '-'}</td>
                        <td>${item.time_out || '-'}</td>
                        <td>${item.status || 'present'}</td>
                        <td>
                            <button class="btn" style="padding: 5px 10px; width: auto; background: #3498db;" onclick="openStatusModal(${item.id}, '${item.status || 'present'}')">Update Status</button>
                            <button class="btn" style="padding: 5px 10px; width: auto; background: #e74c3c;" onclick="deleteItem(${item.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="7">Error loading data: ${error.message}</td></tr>`;
            }
        }

        function openModal() {
            document.getElementById('form-modal').classList.add('active');
            document.getElementById('data-form').reset();
        }

        function closeFormModal() {
            document.getElementById('form-modal').classList.remove('active');
        }

        function openStatusModal(id, currentStatus) {
            document.getElementById('status-modal').classList.add('active');
            document.getElementById('attendance-id').value = id;
            document.getElementById('status-select').value = currentStatus.toLowerCase();
        }

        function closeStatusModal() {
            document.getElementById('status-modal').classList.remove('active');
        }

        async function deleteItem(id) {
            if(!confirm('Are you sure you want to delete this record?')) return;
            try {
                await apiRequest(`${endpoint}/${id}`, 'DELETE');
                loadData();
            } catch(e) {
                alert('Error deleting: ' + e.message);
            }
        }

        document.getElementById('data-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                user_id: document.getElementById('user_id').value,
                date: document.getElementById('date').value,
                time_in: document.getElementById('time_in').value || null,
                time_out: document.getElementById('time_out').value || null,
                status: document.getElementById('add-status-select').value,
                remarks: document.getElementById('remarks').value,
            };

            try {
                await apiRequest(endpoint, 'POST', payload);
                closeFormModal();
                loadData();
            } catch(e) {
                alert('Error saving: ' + e.message);
            }
        });

        document.getElementById('status-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('attendance-id').value;
            const status = document.getElementById('status-select').value;

            try {
                await apiRequest(`${endpoint}/${id}/status`, 'PUT', { status });
                closeStatusModal();
                loadData();
            } catch(e) {
                alert('Error updating: ' + e.message);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadEmployees();
            loadData();
        });
    </script>
</body>
</html>
