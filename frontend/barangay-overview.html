<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Overview - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .two-col { grid-template-columns: 1fr; }
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .meta { color: var(--text-muted); font-size: 12px; }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2>Barangay Overview</h2>
                <div id="topbar-user"></div>
            </header>

            <section class="content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Residents</h3>
                        <div class="value" id="stat-residents">...</div>
                    </div>
                    <div class="stat-card">
                        <h3>Registered Vendors</h3>
                        <div class="value" id="stat-vendors">...</div>
                    </div>
                    <div class="stat-card">
                        <h3>Weekly Collections</h3>
                        <div class="value" id="stat-collections">...</div>
                    </div>
                    <div class="stat-card">
                        <h3>Avg. Collection Time</h3>
                        <div class="value" id="stat-avg-time">...</div>
                    </div>
                </div>

                <div class="two-col">
                    <div class="card">
                        <div class="card-header">
                            <h3>Recent Collections</h3>
                            <a href="schedule.html" class="btn" style="width: auto; padding: 6px 14px;">View All</a>
                        </div>
                        <div id="recent-collections">Loading...</div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3>Active Issues</h3>
                            <a href="reports.html" class="btn" style="width: auto; padding: 6px 14px;">View All</a>
                        </div>
                        <div id="active-issues">Loading...</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Read URL params: ?barangay=<id>&name=<name>
        const urlParams   = new URLSearchParams(window.location.search);
        const barangayId  = urlParams.get('barangay');
        const barangayName = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : null;

        // Update page title and header dynamically
        if (barangayName) {
            document.title = `${barangayName} - KatokKalinis`;
            const h2 = document.querySelector('.topbar h2');
            if (h2) h2.textContent = barangayName;
        }

        function timeDiffHours(start, end) {
            if (!start || !end) return null;
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            const minutes = (eh * 60 + em) - (sh * 60 + sm);
            return minutes > 0 ? minutes / 60 : null;
        }

        async function loadOverview() {
            try {
                // Build query suffix for barangay filter
                const brgyQ = barangayId ? `&barangay_id=${barangayId}` : '';

                const [residentsRes, vendorsRes, routesRes, reportsRes] = await Promise.all([
                    apiRequest('/users?role=resident').catch(() => ({ users: [] })),
                    apiRequest(`/vendors${barangayId ? `?barangay_id=${barangayId}` : ''}`).catch(() => ({ vendors: [] })),
                    apiRequest(`/collection-routes${barangayId ? `?barangay_id=${barangayId}` : ''}`).catch(() => ({ routes: [] })),
                    apiRequest(`/reports${barangayId ? `?barangay_id=${barangayId}` : ''}`).catch(() => ({ reports: [] })),
                ]);

                const residents = residentsRes.users || [];
                const vendors   = vendorsRes.vendors || [];
                const routes    = routesRes.routes || [];
                const reports   = reportsRes.reports || [];

                document.getElementById('stat-residents').textContent = residents.length;
                document.getElementById('stat-vendors').textContent   = vendors.length;

                // "This week" = collection routes within the last 7 days.
                const now     = new Date();
                const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                const weeklyRoutes = routes.filter(r => new Date(r.collection_date) >= weekAgo);
                document.getElementById('stat-collections').textContent = weeklyRoutes.length;

                const completedWithTimes = routes.filter(r => r.status === 'completed' && r.start_time && r.end_time);
                const durations = completedWithTimes.map(r => timeDiffHours(r.start_time, r.end_time)).filter(d => d !== null);
                const avgHours  = durations.length ? (durations.reduce((a, b) => a + b, 0) / durations.length).toFixed(1) : 'N/A';
                document.getElementById('stat-avg-time').textContent = durations.length ? `${avgHours} hrs` : 'N/A';

                // Recent collections (latest 5)
                const recentContainer = document.getElementById('recent-collections');
                if (routes.length === 0) {
                    recentContainer.innerHTML = '<p>No collection runs recorded yet.</p>';
                } else {
                    recentContainer.innerHTML = routes.slice(0, 5).map(r => `
                        <div class="list-item">
                            <div>
                                <strong>${(r.barangay && r.barangay.name) || barangayName || 'Unknown Barangay'}</strong><br>
                                <span class="meta">Truck ${(r.truck && r.truck.truck_number) || '-'} &middot; ${r.collection_date ? r.collection_date.substring(0, 10) : '-'}</span>
                            </div>
                            <span class="pill pill-${r.status === 'completed' ? 'green' : (r.status === 'cancelled' ? 'red' : 'blue')}">${r.status}</span>
                        </div>
                    `).join('');
                }

                // Active issues (pending / reviewed reports)
                const activeContainer = document.getElementById('active-issues');
                const activeReports   = reports.filter(r => r.status === 'pending' || r.status === 'reviewed');
                if (activeReports.length === 0) {
                    activeContainer.innerHTML = '<p>No active issues right now.</p>';
                } else {
                    activeContainer.innerHTML = activeReports.slice(0, 5).map(r => {
                        const imgUrl = resolveMediaUrl(r.image_url || r.image);
                        const safeTitle = escapeHtml(r.title || 'Untitled report');
                        const safeBarangay = (r.barangay && escapeHtml(r.barangay.name)) || escapeHtml(barangayName) || '-';
                        const safeAuthor = (r.user && escapeHtml(r.user.name)) || 'Anonymous';
                        const safeStatus = escapeHtml(r.status || 'pending');

                        return `
                        <div class="list-item" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                            <div style="display:flex;align-items:center;gap:10px;">
                                ${imgUrl ? `
                                    <a href="${imgUrl}" target="_blank" rel="noopener noreferrer" title="View attached photo" style="flex-shrink:0;">
                                        <img src="${imgUrl}" alt="Photo" style="width:38px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--border);" onerror="this.style.display='none'">
                                    </a>
                                ` : ''}
                                <div>
                                    <div style="display:flex;align-items:center;gap:6px;">
                                        <strong>${safeTitle}</strong>
                                        ${imgUrl ? '<span style="font-size:10px;background:rgba(46,125,50,0.12);color:#2e7d32;padding:1px 5px;border-radius:3px;font-weight:600;">📷 Photo</span>' : ''}
                                    </div>
                                    <span class="meta">${safeBarangay} &middot; ${safeAuthor}</span>
                                </div>
                            </div>
                            <span class="pill pill-${r.status === 'pending' ? 'orange' : 'blue'}">${safeStatus}</span>
                        </div>
                    `;
                    }).join('');
                }
            } catch (error) {
                console.error('Failed to load barangay overview', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadOverview);
    </script>
</body>
</html>
