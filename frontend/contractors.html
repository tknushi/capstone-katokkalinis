<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oversight, performance monitoring, and management of accredited private waste collection contractors.">
    <title>Contractor Oversight | Katok Kalinis</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Contractors</h2>
                <div id="topbar-user"></div>
            </header>
            
            <section class="content">
                <div class="stats-grid">
                    <div class="stat-card"><h3>Active Contractors</h3><div class="value" id="stat-active">...</div></div>
                    <div class="stat-card"><h3>Total Fleet Allocation</h3><div class="value" id="stat-value">12 Units</div></div>
                    <div class="stat-card"><h3>Registered Firms</h3><div class="value" id="stat-total">...</div></div>
                    <div class="stat-card"><h3>Average Compliance</h3><div class="value" id="stat-performance">94.8%</div></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>Contractor Oversight</h3>
                        <button class="btn" onclick="openModal()" style="width: auto;">Add Contractor</button>
                    </div>
                    <div id="table-body" class="record-grid">
                        <p>Loading contractors...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div id="form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Contractor</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="data-form">
                <input type="hidden" id="item-id">
                <div class="form-group">
                    <label for="contractor_code">Contractor Code</label>
                    <input type="text" id="contractor_code" class="form-control" placeholder="e.g. IPM-CDO-01" required>
                </div>
                <div class="form-group">
                    <label for="company_name">Company Name</label>
                    <input type="text" id="company_name" class="form-control" placeholder="e.g. IPM Environmental Services" required>
                </div>
                <div class="form-group">
                    <label for="contact_person">Contact Person</label>
                    <input type="text" id="contact_person" class="form-control" placeholder="e.g. Roberto Villanueva" required>
                </div>
                <div class="form-group">
                    <label for="contact_number">Contact Number</label>
                    <input type="text" id="contact_number" class="form-control" placeholder="e.g. 0917-882-9912">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g. operations@ipm.com.ph">
                </div>
                <div class="form-group">
                    <label for="address">Depot Address</label>
                    <input type="text" id="address" class="form-control" placeholder="e.g. Upper Carmen, Cagayan de Oro City">
                </div>
                <div class="form-group">
                    <label for="status">Operating Status</label>
                    <select id="status" class="form-control" required>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Scope / Service Notes</label>
                    <textarea id="description" class="form-control" placeholder="Assigned routes, compactor counts, or service coverage details..."></textarea>
                </div>
                <button type="submit" class="btn">Save Contractor Profile</button>
            </form>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 id="details-company-name">Contractor Details</h3>
                <span class="close-btn" onclick="closeDetailsModal()">&times;</span>
            </div>
            <div id="details-body" style="padding: 10px 0; font-size: 13.5px; line-height: 1.6;"></div>
            <div style="display:flex; justify-content: flex-end; margin-top: 16px;">
                <button type="button" class="btn" style="width: auto;" onclick="closeDetailsModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const endpoint = '/contractors';
        let contractorsData = [];

        async function loadData() {
            const tbody = document.getElementById('table-body');
            try {
                const res = await apiRequest(endpoint);
                const data = res.contractors || [];
                contractorsData = data;
                
                document.getElementById('stat-total').textContent = data.length;
                document.getElementById('stat-active').textContent = data.filter(c => c.status === 'active').length;

                if (data.length === 0) {
                    tbody.innerHTML = '<p class="empty-state">No contractors recorded yet.</p>';
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <article class="record-card">
                        <div class="record-avatar" aria-hidden="true">●</div>
                        <div class="record-main"><strong>${escapeHtml(item.company_name || '-')}</strong><span>${escapeHtml(item.contractor_code || '-')}</span></div>
                        <div class="record-meta">
                            <span>${escapeHtml(item.contact_person || '-')}</span>
                            <span>${item.email ? formatEmailLink(item.email) : '-'}</span>
                            <span class="pill ${item.status === 'active' ? 'pill-green' : 'pill-orange'}">${escapeHtml(item.status || '-')}</span>
                        </div>
                        <div class="record-actions">
                            <button class="btn" onclick='editItem(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Edit</button>
                            <button class="btn record-outline" onclick='viewContractorDetails(${JSON.stringify(item).replace(/'/g, "&#39;")})'>View Details</button>
                        </div>
                    </article>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<p class="empty-state">Error loading data: ${escapeHtml(error.message)}</p>`;
            }
        }

        function openModal() {
            document.getElementById('form-modal').classList.add('active');
            document.getElementById('modal-title').textContent = 'Add Contractor';
            document.getElementById('data-form').reset();
            document.getElementById('item-id').value = '';
        }

        function closeModal() {
            document.getElementById('form-modal').classList.remove('active');
        }

        function viewContractorDetails(item) {
            document.getElementById('details-company-name').textContent = item.company_name || 'Contractor Profile';
            document.getElementById('details-body').innerHTML = `
                <div style="display:grid; gap: 8px;">
                    <div><strong>Contractor Code:</strong> ${escapeHtml(item.contractor_code || 'N/A')}</div>
                    <div><strong>Contact Person:</strong> ${escapeHtml(item.contact_person || 'N/A')}</div>
                    <div><strong>Contact Number:</strong> ${formatPhoneLink(item.contact_number)}</div>
                    <div><strong>Email Address:</strong> ${formatEmailLink(item.email)}</div>
                    <div><strong>Depot Address:</strong> ${escapeHtml(item.address || 'Not recorded')}</div>
                    <div><strong>Operating Status:</strong> <span class="pill ${item.status === 'active' ? 'pill-green' : 'pill-orange'}" style="text-transform: capitalize;">${escapeHtml(item.status || 'Active')}</span></div>
                    <div><strong>Service Scope:</strong> ${escapeHtml(item.description || 'General municipal hauling partner')}</div>
                </div>
            `;
            document.getElementById('details-modal').classList.add('active');
        }

        function closeDetailsModal() {
            document.getElementById('details-modal').classList.remove('active');
        }

        function editItem(item) {
            openModal();
            document.getElementById('modal-title').textContent = 'Edit Contractor';
            document.getElementById('item-id').value = item.id;
            document.getElementById('contractor_code').value = item.contractor_code || '';
            document.getElementById('company_name').value = item.company_name || '';
            document.getElementById('contact_person').value = item.contact_person || '';
            document.getElementById('contact_number').value = item.contact_number || '';
            document.getElementById('email').value = item.email || '';
            document.getElementById('address').value = item.address || '';
            document.getElementById('status').value = item.status || 'active';
            document.getElementById('description').value = item.description || '';
        }

        async function deleteItem(id) {
            if(!confirm('Are you sure you want to delete this contractor?')) return;
            try {
                await apiRequest(`${endpoint}/${id}`, 'DELETE');
                showToast('Contractor record deleted successfully.', 'success');
                loadData();
            } catch(e) {
                showToast('Error deleting contractor: ' + e.message, 'error');
            }
        }

        document.getElementById('data-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const payload = {
                contractor_code: document.getElementById('contractor_code').value.trim(),
                company_name: document.getElementById('company_name').value.trim(),
                contact_person: document.getElementById('contact_person').value.trim(),
                contact_number: document.getElementById('contact_number').value.trim(),
                email: document.getElementById('email').value.trim(),
                address: document.getElementById('address').value.trim(),
                status: document.getElementById('status').value,
                description: document.getElementById('description').value.trim(),
            };

            try {
                if (id) {
                    await apiRequest(`${endpoint}/${id}`, 'PUT', payload);
                    showToast('Contractor profile updated successfully!', 'success');
                } else {
                    await apiRequest(endpoint, 'POST', payload);
                    showToast('Contractor successfully registered!', 'success');
                }
                closeModal();
                loadData();
            } catch(e) {
                showToast('Error saving contractor: ' + e.message, 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
