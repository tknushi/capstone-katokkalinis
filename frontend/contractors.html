<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractors - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Contractors</h2>
                <div id="topbar-user"></div>
            </header>
            
            <section class="content">
                <div class="stats-grid">
                    <div class="stat-card"><h3>Active Contractors</h3><div class="value" id="stat-active">...</div></div>
                    <div class="stat-card"><h3>Total Value</h3><div class="value" id="stat-value">N/A</div></div>
                    <div class="stat-card"><h3>Contractors</h3><div class="value" id="stat-total">...</div></div>
                    <div class="stat-card"><h3>Average Performance</h3><div class="value" id="stat-performance">N/A</div></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h3>Contractor Oversight</h3>
                        <button class="btn" onclick="openModal()" style="width: auto;">Add Contractor</button>
                    </div>
                    <div id="table-body" class="record-grid">
                        <p>Loading contractors...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div id="form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Contractor</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="data-form">
                <input type="hidden" id="item-id">
                <div class="form-group">
                    <label>Contractor Code</label>
                    <input type="text" id="contractor_code" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" id="company_name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contact Person</label>
                    <input type="text" id="contact_person" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="contact_number" class="form-control">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" class="form-control">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status" class="form-control" required>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" class="form-control"></textarea>
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const endpoint = '/contractors';

        async function loadData() {
            const tbody = document.getElementById('table-body');
            try {
                const res = await apiRequest(endpoint);
                const data = res.data || [];
                document.getElementById('stat-active').textContent = data.filter(item => item.status === 'active').length;
                document.getElementById('stat-total').textContent = data.length;

                if (data.length === 0) {
                    tbody.innerHTML = '<p class="empty-state">No contractors found.</p>';
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <article class="record-card">
                        <div class="record-avatar" aria-hidden="true">●</div>
                        <div class="record-main"><strong>${item.company_name || '-'}</strong><span>${item.contractor_code || '-'}</span></div>
                        <div class="record-meta"><span>${item.contact_person || '-'}</span><span>${item.email || '-'}</span><span class="pill ${item.status === 'active' ? 'pill-green' : 'pill-orange'}">${item.status || '-'}</span></div>
                        <div class="record-actions">
                            <button class="btn" onclick='editItem(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Edit</button>
                            <button class="btn record-outline" onclick="alert('Address: ${item.address || 'Not recorded'}\nDescription: ${item.description || 'Not recorded'}')">View Details</button>
                        </div>
                    </article>
                `).join('');
            } catch (error) {
                tbody.innerHTML = `<p class="empty-state">Error loading data: ${error.message}</p>`;
            }
        }

        function openModal() {
            document.getElementById('form-modal').classList.add('active');
            document.getElementById('modal-title').textContent = 'Add Contractor';
            document.getElementById('data-form').reset();
            document.getElementById('item-id').value = '';
        }

        function closeModal() {
            document.getElementById('form-modal').classList.remove('active');
        }

        function editItem(item) {
            openModal();
            document.getElementById('modal-title').textContent = 'Edit Contractor';
            document.getElementById('item-id').value = item.id;
            document.getElementById('contractor_code').value = item.contractor_code || '';
            document.getElementById('company_name').value = item.company_name || '';
            document.getElementById('contact_person').value = item.contact_person || '';
            document.getElementById('contact_number').value = item.contact_number || '';
            document.getElementById('email').value = item.email || '';
            document.getElementById('address').value = item.address || '';
            document.getElementById('status').value = item.status || 'active';
            document.getElementById('description').value = item.description || '';
        }

        async function deleteItem(id) {
            if(!confirm('Are you sure you want to delete this contractor?')) return;
            try {
                await apiRequest(`${endpoint}/${id}`, 'DELETE');
                loadData();
            } catch(e) {
                alert('Error deleting: ' + e.message);
            }
        }

        document.getElementById('data-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const payload = {
                contractor_code: document.getElementById('contractor_code').value,
                company_name: document.getElementById('company_name').value,
                contact_person: document.getElementById('contact_person').value,
                contact_number: document.getElementById('contact_number').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                status: document.getElementById('status').value,
                description: document.getElementById('description').value,
            };

            try {
                if (id) {
                    await apiRequest(`${endpoint}/${id}`, 'PUT', payload);
                } else {
                    await apiRequest(endpoint, 'POST', payload);
                }
                closeModal();
                loadData();
            } catch(e) {
                alert('Error saving: ' + e.message);
            }
        });

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
