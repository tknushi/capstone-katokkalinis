<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Katok Kalinis is the official municipal waste collection and environmental sanitation management platform for CLENRO Cagayan de Oro.">
    <title>Katok Kalinis | Waste Management & City Services</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);padding:16px;box-sizing:border-box;">
        <div style="text-align:center;padding:32px 24px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);max-width:360px;width:100%;border:1px solid var(--border);box-sizing:border-box;">
            <a href="login.html" style="text-decoration:none;display:inline-block;" title="Katok Kalinis Home">
                <div style="font-size:28px;font-weight:800;margin-bottom:8px;">
                    <span style="color:#2e7d32;">Katok</span><span style="color:#4caf50;">Kalinis</span>
                </div>
            </a>
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px;">Connecting to Katok Kalinis Dashboard...</p>
            <a href="login.html" class="btn" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:12px 24px;background:var(--green-600);color:#fff;border-radius:999px;font-weight:600;min-height:44px;box-sizing:border-box;width:100%;">Go to Login</a>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        (function() {
            const token = localStorage.getItem('auth_token');
            const role = getUserRole();
            if (token && token !== 'demo_session_token' && role) {
                window.location.href = getHomePage(role);
            } else {
                window.location.href = 'login.html';
            }
        })();
    </script>
</body>
</html>
