<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand" aria-label="KatokKalinis">
                <span>Katok</span>
                <span>Kalinis</span>
                <small>Katok. Linis. Gaan ang Buhay.</small>
            </div>
            <div class="auth-card-heading">
                <h1>Login</h1>
            </div>
            <div id="error-message" class="alert alert-error" style="display: none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn" id="login-btn">Login</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const btn = document.getElementById('login-btn');

            try {
                btn.disabled = true;
                btn.textContent = 'Logging in...';
                errorDiv.style.display = 'none';

                const result = await apiRequest('/login', 'POST', { email, password });

                if (!result.token || !result.user) {
                    throw new Error('Login failed: No token received.');
                }

                const roles = Array.isArray(result.user.roles) ? result.user.roles : [];
                const roleName = roles.length > 0 ? roles[0].name : null;

                if (roleName !== 'admin' && roleName !== 'super_admin') {
                    throw new Error('This account is not authorized to access the admin dashboard.');
                }

                localStorage.setItem('auth_token', result.token);
                localStorage.setItem('user', JSON.stringify(result.user));
                window.location.href = getHomePage(roleName);
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
