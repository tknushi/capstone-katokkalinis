<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residents - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            margin: 2px;
            border-radius: 12px;
            background: var(--surface-alt);
            color: var(--green-800);
            font-size: 12px;
        }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-bar input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
        }
        .checkbox-list label { display: block; font-weight: normal; margin-bottom: 6px; }
        .checkbox-list input { width: auto; margin-right: 8px; }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2>Resident Management</h2>
                <div id="topbar-user"></div>
            </header>

            <section class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Residents in this Barangay</h3>
                    </div>
                    <div class="filter-bar">
                        <input type="text" id="search-box" placeholder="Search by name or email...">
                        <button class="btn" onclick="loadData()" style="width: auto;">Search</button>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Roles / Permissions</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="6">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Permissions Modal -->
    <div id="form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Permissions</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="data-form">
                <input type="hidden" id="item-id">
                <p style="margin-bottom: 12px; color: var(--text-muted); font-size: 13px;">
                    Customize this resident's access by assigning or removing roles.
                </p>
                <div class="form-group">
                    <label>Roles / Permissions</label>
                    <div class="checkbox-list" id="roles-checklist"></div>
                </div>
                <button type="submit" class="btn">Save Permissions</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let allRoles = [];

        async function loadRoles() {
            try {
                const res = await apiRequest('/roles');
                allRoles = res.roles || [];
            } catch (error) {
                console.error('Failed to load roles', error);
            }
        }

        async function loadData() {
            const tbody = document.getElementById('table-body');
            const search = document.getElementById('search-box').value;

            let query = ['role=resident'];
            if (search) query.push(`search=${encodeURIComponent(search)}`);
            const qs = `?${query.join('&')}`;

            try {
                const res = await apiRequest('/users' + qs);
                const data = res.users || [];

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No residents found.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => {
                    const roleBadges = (item.roles || []).map(r => `<span class="role-badge">${r.name}</span>`).join('');
                    const joined = item.created_at ? item.created_at.substring(0, 10) : '-';
                    return `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.email}</td>
                        <td>${roleBadges || '-'}</td>
                        <td>${joined}</td>
                        <td>
                            <button class="btn" style="padding: 5px 10px; width: auto; background: #3498db;" onclick='editPermissions(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Edit Permissions</button>
                        </td>
                    </tr>
                `;}).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6">Error loading data: ${error.message}</td></tr>`;
            }
        }

        function closeModal() {
            document.getElementById('form-modal').classList.remove('active');
        }

        function editPermissions(item) {
            document.getElementById('form-modal').classList.add('active');
            document.getElementById('item-id').value = item.id;
            const userRoleIds = (item.roles || []).map(r => r.id);
            const container = document.getElementById('roles-checklist');
            container.innerHTML = allRoles.map(r => `
                <label>
                    <input type="checkbox" value="${r.id}" ${userRoleIds.includes(r.id) ? 'checked' : ''}>
                    ${r.name}
                </label>
            `).join('');
        }

        document.getElementById('data-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const roleIds = Array.from(document.querySelectorAll('#roles-checklist input:checked')).map(cb => parseInt(cb.value, 10));

            try {
                await apiRequest(`/users/${id}/roles`, 'PUT', { role_ids: roleIds });
                closeModal();
                loadData();
            } catch(e) {
                alert('Error saving permissions: ' + e.message);
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await loadRoles();
            loadData();
        });
    </script>
</body>
</html>
