<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Scoped styles for Collection Calendar & Recent Reports */

        /* Calendar Header Navigation */
        .cal-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .cal-nav-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .cal-title-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .cal-main-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: var(--green-900);
            letter-spacing: -0.2px;
        }

        .cal-nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0;
        }

        .cal-nav-btn:hover {
            color: var(--green-800);
            border-color: var(--green-500);
            background: var(--green-50);
            transform: scale(1.04);
        }

        .cal-nav-btn:focus-visible {
            outline: 2px solid var(--green-600);
            outline-offset: 2px;
        }

        .cal-today-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 12px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .cal-today-btn:hover {
            border-color: var(--green-500);
            color: var(--green-800);
            background: var(--green-50);
        }

        /* Calendar Grid */
        .schedule-calendar {
            display: grid;
            grid-template-columns: repeat(7, minmax(95px, 1fr));
            gap: 6px;
            margin-top: 14px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .calendar-day-name {
            padding: 9px 6px;
            color: var(--green-800);
            font-size: 11.5px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: var(--surface-alt);
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .calendar-day {
            min-height: 104px;
            padding: 8px;
            border-radius: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            position: relative;
        }

        .calendar-day:hover {
            border-color: var(--green-300);
        }

        .calendar-day-empty {
            background: transparent !important;
            border-color: transparent !important;
            min-height: 0;
            box-shadow: none !important;
        }

        .calendar-day-today {
            border-color: var(--green-600) !important;
            background: rgba(22, 163, 74, 0.04);
            box-shadow: 0 0 0 1px var(--green-600) inset;
        }

        .cal-day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .cal-day-num {
            font-weight: 700;
            font-size: 12.5px;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
        }

        .calendar-day-today .cal-day-num {
            background: var(--green-600);
            color: #ffffff !important;
        }

        .cal-event-count {
            font-size: 10.5px;
            font-weight: 700;
            color: var(--green-800);
            background: var(--green-100);
            padding: 1px 6px;
            border-radius: 10px;
        }

        .cal-events-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        /* High-Contrast Calendar Event Blocks */
        .calendar-event-block {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            border-radius: 4px;
            background: #d1fae5;
            border: 1px solid #a7f3d0;
            border-left: 3px solid #15803d;
            color: #064e3b;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.12s ease;
            text-decoration: none;
            user-select: none;
            line-height: 1.25;
        }

        .calendar-event-block:hover {
            background: #bbf7d0;
            border-color: #15803d;
            box-shadow: 0 2px 5px rgba(22, 163, 74, 0.18);
            transform: translateY(-1px);
        }

        .calendar-event-block:focus-visible {
            outline: 2px solid #15803d;
            outline-offset: 1px;
        }

        .calendar-event-block .event-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
            display: block;
        }

        .calendar-event-more {
            font-size: 10.5px;
            color: var(--green-700);
            font-weight: 700;
            padding: 2px 4px;
            cursor: pointer;
        }

        .calendar-event-more:hover {
            text-decoration: underline;
        }

        /* Recent Reports Section & Table */
        .reports-table-card {
            margin-top: 24px;
        }

        .reports-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--green-100);
            color: var(--green-800);
            font-size: 11px;
            font-weight: 700;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .reports-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 5px;
            min-width: 680px;
        }

        .reports-table th {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--green-800);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 10px 14px;
            border-bottom: 2px solid var(--border);
            background: transparent;
            text-align: left;
        }

        .reports-table td {
            padding: 12px 14px;
            background: var(--surface);
            vertical-align: middle;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text);
            transition: background 0.12s ease;
        }

        .reports-table tr td:first-child {
            border-left: 1px solid var(--border);
            border-radius: 8px 0 0 8px;
        }

        .reports-table tr td:last-child {
            border-right: 1px solid var(--border);
            border-radius: 0 8px 8px 0;
        }

        .reports-table tr:hover td {
            background: var(--surface-alt);
        }

        /* Driver Cell with Typographic Hierarchy */
        .driver-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .driver-avatar-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--green-600);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .driver-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .driver-name {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.25;
        }

        .driver-subtext {
            font-size: 11.5px;
            color: #4B5563; /* High-contrast readable medium gray */
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Status Pills with Dots */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .status-pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-pill-green {
            background: #DCFCE7;
            color: #166534;
            border: 1px solid #BBF7D0;
        }
        .status-pill-green .status-pill-dot { background: #16a34a; }

        .status-pill-blue {
            background: #EFF6FF;
            color: #1E40AF;
            border: 1px solid #BFDBFE;
        }
        .status-pill-blue .status-pill-dot { background: #2563eb; }

        .status-pill-orange {
            background: #FFF7ED;
            color: #9A3412;
            border: 1px solid #FED7AA;
        }
        .status-pill-orange .status-pill-dot { background: #EA580C; }

        .status-pill-gray {
            background: #F3F4F6;
            color: #374151;
            border: 1px solid #D1D5DB;
        }
        .status-pill-gray .status-pill-dot { background: #6B7280; }

        /* Dark Theme Support */
        [data-theme="dark"] .cal-main-title {
            color: #86efac;
        }

        [data-theme="dark"] .cal-nav-btn,
        [data-theme="dark"] .cal-today-btn {
            background: var(--surface);
            border-color: var(--border);
            color: var(--text);
        }

        [data-theme="dark"] .cal-nav-btn:hover,
        [data-theme="dark"] .cal-today-btn:hover {
            background: var(--surface-alt);
            border-color: var(--green-400);
            color: #4ade80;
        }

        [data-theme="dark"] .calendar-day-name {
            background: var(--surface-alt);
            color: #86efac;
            border-color: var(--border);
        }

        [data-theme="dark"] .calendar-day {
            background: var(--surface);
            border-color: var(--border);
        }

        [data-theme="dark"] .calendar-day-today {
            background: rgba(34, 197, 94, 0.08);
        }

        [data-theme="dark"] .calendar-event-block {
            background: rgba(22, 163, 74, 0.22);
            border: 1px solid rgba(74, 222, 128, 0.35);
            border-left: 3px solid #4ade80;
            color: #ecfdf5;
        }

        [data-theme="dark"] .calendar-event-block:hover {
            background: rgba(22, 163, 74, 0.35);
        }

        [data-theme="dark"] .driver-subtext {
            color: #9CA3AF;
        }

        [data-theme="dark"] .status-pill-green {
            background: rgba(22, 163, 74, 0.18);
            border-color: rgba(22, 163, 74, 0.35);
            color: #4ade80;
        }

        [data-theme="dark"] .status-pill-blue {
            background: rgba(37, 99, 235, 0.18);
            border-color: rgba(37, 99, 235, 0.35);
            color: #60a5fa;
        }

        [data-theme="dark"] .status-pill-orange {
            background: rgba(234, 88, 12, 0.18);
            border-color: rgba(234, 88, 12, 0.35);
            color: #fb923c;
        }

        [data-theme="dark"] .status-pill-gray {
            background: rgba(156, 163, 175, 0.15);
            border-color: rgba(156, 163, 175, 0.25);
            color: #D1D5DB;
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Schedule</h2>
                <div id="topbar-user"></div>
            </header>
            
            <section class="content">
                <!-- Collection Calendar Section -->
                <div class="card calendar-card">
                    <div class="card-header cal-card-header">
                        <div class="cal-nav-container">
                            <div class="cal-title-nav">
                                <button type="button" 
                                        class="cal-nav-btn has-tooltip" 
                                        id="cal-prev-btn" 
                                        data-tooltip="Previous Month" 
                                        aria-label="Previous Month" 
                                        onclick="changeMonth(-1)">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="15 18 9 12 15 6"></polyline>
                                    </svg>
                                </button>
                                <h3 id="calendar-title" class="cal-main-title">Collection Calendar</h3>
                                <button type="button" 
                                        class="cal-nav-btn has-tooltip" 
                                        id="cal-next-btn" 
                                        data-tooltip="Next Month" 
                                        aria-label="Next Month" 
                                        onclick="changeMonth(1)">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                            </div>
                            <button type="button" class="cal-today-btn" id="cal-today-btn" onclick="goToToday()">Today</button>
                        </div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="btn" onclick="openBroadcastModal()" style="width: auto; background: #2e7d32; display: inline-flex; align-items: center; gap: 6px;">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                                Push Advisory
                            </button>
                            <button class="btn" onclick="openModal()" style="width: auto; display: inline-flex; align-items: center; gap: 6px;">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                Create Schedule
                            </button>
                        </div>
                    </div>
                    <div id="schedule-calendar" class="schedule-calendar">Loading calendar...</div>
                </div>

                <!-- Recent Reports Section -->
                <div class="card reports-table-card">
                    <div class="card-header" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <h3 style="margin: 0;">Recent Reports</h3>
                            <span class="reports-badge" id="reports-count-badge">0 total</span>
                        </div>
                        <div style="font-size: 12.5px; color: var(--text-muted);">
                            Latest collection route reports from drivers
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="reports-table" id="recent-reports-table">
                            <thead>
                                <tr>
                                    <th style="width: 28%;">Driver</th>
                                    <th style="width: 20%;">Location</th>
                                    <th style="width: 14%;">Date</th>
                                    <th style="width: 18%;">Time</th>
                                    <th style="width: 12%;">Status</th>
                                    <th style="width: 8%; text-align: center;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="recent-admin-reports">
                                <tr><td colspan="6" style="text-align: center; padding: 24px; color: var(--text-muted);">Loading driver reports...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Add/Edit Schedule Modal -->
    <div id="form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Schedule</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="data-form">
                <input type="hidden" id="item-id">
                <div class="form-group">
                    <label>Barangay</label>
                    <select id="barangay_id" class="form-control" required>
                        <option value="">-- Select Barangay --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date of Duty</label>
                    <input type="date" id="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Pickup Time</label>
                    <input type="time" id="pickup_time" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status" class="form-control" required>
                        <option value="scheduled">Scheduled</option>
                        <option value="in_progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="active" checked style="width: auto;"> Active
                    </label>
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>

    <!-- View Report Detail Modal -->
    <div id="report-modal" class="modal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 id="report-modal-title">Collection Route Report</h3>
                <span class="close-btn" onclick="closeReportModal()">&times;</span>
            </div>
            <div id="report-modal-body" style="display: flex; flex-direction: column; gap: 14px; margin-top: 10px;">
                <!-- Populated dynamically -->
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px;">
                <button type="button" class="btn" style="width: auto; background: var(--border); color: var(--text);" onclick="closeReportModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Broadcast Push Advisory Modal -->
    <div id="broadcast-modal" class="modal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3>Dispatch Push Advisory directly to Phones</h3>
                <span class="close-btn" onclick="closeBroadcastModal()">&times;</span>
            </div>
            <form id="broadcast-form" onsubmit="handleSendBroadcast(event)" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Advisory Category (Approved Scope)</label>
                    <select id="broadcast-type" class="form-control" required>
                        <option value="schedule">Collection Schedule Advisory</option>
                        <option value="advisory">Sanitation Advisory</option>
                        <option value="announcement">City Sanitation Announcement</option>
                        <option value="inspection">Public Market Inspection Notice</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Target Audience (Role)</label>
                    <select id="broadcast-role" class="form-control">
                        <option value="">All Roles (Residents, Drivers, Inspectors, Vendors)</option>
                        <option value="resident">Residents Only</option>
                        <option value="driver">Collection Drivers Only</option>
                        <option value="inspector">Sanitation Inspectors Only</option>
                        <option value="vendor">Market Vendors Only</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Target Geographic Jurisdiction (Barangays 1 to 40)</label>
                    <select id="broadcast-barangay" class="form-control">
                        <option value="">All Pilot Barangays (1 to 40)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Advisory Title</label>
                    <input type="text" id="broadcast-title" class="form-control" placeholder="e.g. Compactor Collection Schedule Advisory" required maxlength="120">
                </div>
                <div class="form-group">
                    <label>Advisory Message</label>
                    <textarea id="broadcast-message" class="form-control" rows="3" placeholder="Enter message to deliver directly to mobile phone notification tray..." required maxlength="400"></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px;">
                    <button type="button" class="btn" style="width: auto; background: var(--border); color: var(--text);" onclick="closeBroadcastModal()">Cancel</button>
                    <button type="submit" id="broadcast-submit-btn" class="btn" style="width: auto; background: #2e7d32;">Send Push Notification</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const endpoint = '/schedules';
        let barangays = [];
        let schedules = [];
        let recentReportsData = [];
        let currentCalDate = new Date(); // Month navigation state

        function openBroadcastModal() {
            const select = document.getElementById('broadcast-barangay');
            if (select && select.options.length <= 1) {
                for (let i = 1; i <= 40; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `Barangay ${i}`;
                    select.appendChild(opt);
                }
            }
            document.getElementById('broadcast-modal').classList.add('active');
        }

        function closeBroadcastModal() {
            document.getElementById('broadcast-modal').classList.remove('active');
        }

        async function handleSendBroadcast(e) {
            e.preventDefault();
            const btn = document.getElementById('broadcast-submit-btn');
            btn.disabled = true;
            btn.textContent = 'Transmitting...';

            const payload = {
                type: document.getElementById('broadcast-type').value,
                role: document.getElementById('broadcast-role').value || undefined,
                barangay_id: document.getElementById('broadcast-barangay').value ? Number(document.getElementById('broadcast-barangay').value) : undefined,
                title: document.getElementById('broadcast-title').value.trim(),
                message: document.getElementById('broadcast-message').value.trim(),
            };

            try {
                const res = await apiRequest('/notifications/broadcast', 'POST', payload);
                if (res && res.success) {
                    alert(`Push advisory dispatched successfully! Delivered to registered mobile devices.`);
                    closeBroadcastModal();
                    document.getElementById('broadcast-form').reset();
                } else {
                    alert('Broadcast error: ' + (res.message || 'Failed to dispatch notification'));
                }
            } catch (err) {
                alert('Connection error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Push Notification';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime12(timeStr) {
            if (!timeStr) return '';
            const parts = timeStr.split(':');
            if (parts.length < 2) return timeStr;
            let hour = parseInt(parts[0], 10);
            const minute = parts[1];
            const ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12 || 12;
            return `${hour}:${minute} ${ampm}`;
        }

        function getInitials(name) {
            if (!name) return 'D';
            return name.split(' ').map(n => n[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
        }

        function getStatusPillHtml(status) {
            if (status === 'completed') {
                return '<span class="status-pill status-pill-green"><span class="status-pill-dot"></span>Completed</span>';
            } else if (status === 'in_progress') {
                return '<span class="status-pill status-pill-blue"><span class="status-pill-dot"></span>In Progress</span>';
            } else if (status === 'cancelled') {
                return '<span class="status-pill status-pill-gray"><span class="status-pill-dot"></span>Cancelled</span>';
            } else {
                return '<span class="status-pill status-pill-orange"><span class="status-pill-dot"></span>Scheduled</span>';
            }
        }

        function changeMonth(delta) {
            // Set date to 1st of month to avoid overflow issues (e.g. 31st to 30-day month)
            currentCalDate = new Date(currentCalDate.getFullYear(), currentCalDate.getMonth() + delta, 1);
            renderCalendar();
        }

        function goToToday() {
            currentCalDate = new Date();
            renderCalendar();
        }

        function renderCalendar() {
            const calendar = document.getElementById('schedule-calendar');
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            const now = new Date();
            const isCurrentMonth = (now.getFullYear() === year && now.getMonth() === month);
            const todayDate = now.getDate();

            const scheduleDates = schedules.reduce((dates, item) => {
                if (item.date) {
                    const d = String(item.date).substring(0, 10);
                    dates[d] = (dates[d] || []).concat(item);
                }
                return dates;
            }, {});

            const monthTitle = currentCalDate.toLocaleString('en', { month: 'long', year: 'numeric' });
            document.getElementById('calendar-title').textContent = `Collection Calendar · ${monthTitle}`;

            let html = dayNames.map(day => `<div class="calendar-day-name">${day}</div>`).join('');
            
            // Empty leading day slots
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day calendar-day-empty" aria-hidden="true"></div>';
            }

            // Month days
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const entries = scheduleDates[dateKey] || [];
                const isToday = isCurrentMonth && (day === todayDate);

                const visibleEntries = entries.slice(0, 2);
                const overflowCount = entries.length - visibleEntries.length;

                let entriesHtml = visibleEntries.map(item => {
                    const time12 = formatTime12(item.pickup_time);
                    const brgy = item.barangay?.name || 'Collection';
                    const displayLabel = time12 ? `${time12} · ${brgy}` : brgy;
                    const fullTooltip = `${brgy} (${time12 || 'No time set'}) - Status: ${item.status || 'scheduled'}${item.notes ? ' · Note: ' + item.notes : ''}`;

                    return `
                        <div class="calendar-event-block has-tooltip" 
                             data-tooltip="${escapeHtml(fullTooltip)}"
                             title="${escapeHtml(fullTooltip)}"
                             tabindex="0"
                             role="button"
                             aria-label="Schedule: ${escapeHtml(displayLabel)}"
                             onclick="editItemById(${item.id})">
                            <span class="event-text">${escapeHtml(displayLabel)}</span>
                        </div>
                    `;
                }).join('');

                if (overflowCount > 0) {
                    entriesHtml += `<div class="calendar-event-more" onclick="openModalWithDate('${dateKey}')">+${overflowCount} more</div>`;
                }

                html += `
                    <div class="calendar-day ${isToday ? 'calendar-day-today' : ''}">
                        <div class="cal-day-header">
                            <span class="cal-day-num">${day}</span>
                            ${entries.length ? `<span class="cal-event-count" aria-label="${entries.length} scheduled">${entries.length}</span>` : ''}
                        </div>
                        <div class="cal-events-wrap">
                            ${entriesHtml}
                        </div>
                    </div>
                `;
            }

            calendar.innerHTML = html;
        }

        function editItemById(id) {
            const item = schedules.find(s => s.id === id);
            if (item) {
                editItem(item);
            }
        }

        function openModalWithDate(dateStr) {
            openModal();
            document.getElementById('date').value = dateStr;
        }

        async function loadRecentAdminReports() {
            const tbody = document.getElementById('recent-admin-reports');
            try {
                const res = await apiRequest('/collection-routes');
                const reports = res.routes || [];
                recentReportsData = reports;
                const displayReports = reports.slice(0, 8);

                const badge = document.getElementById('reports-count-badge');
                if (badge) badge.textContent = `${reports.length} total`;

                if (!displayReports.length) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 24px; color: var(--text-muted);">No driver reports recorded yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = displayReports.map(report => {
                    const driverName = report.truck?.driver?.name || 'Driver not assigned';
                    const truckText = report.truck?.truck_number ? `${report.truck.truck_number}${report.truck.plate_number ? ' · ' + report.truck.plate_number : ''}` : 'Truck not assigned';
                    const brgyName = report.barangay?.name || 'Barangay not recorded';
                    const dateFormatted = report.collection_date ? report.collection_date.substring(0, 10) : '-';
                    const startTime = report.start_time ? formatTime12(report.start_time) : '-';
                    const endTime = report.end_time ? formatTime12(report.end_time) : '-';
                    const timeRange = (startTime !== '-' || endTime !== '-') ? `${startTime} - ${endTime}` : '-';
                    const statusPill = getStatusPillHtml(report.status);
                    const initials = getInitials(driverName);

                    return `
                        <tr>
                            <td>
                                <div class="driver-cell">
                                    <span class="driver-avatar-circle" aria-hidden="true">${escapeHtml(initials)}</span>
                                    <div class="driver-meta">
                                        <strong class="driver-name">${escapeHtml(driverName)}</strong>
                                        <span class="driver-subtext">${escapeHtml(truckText)}</span>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--green-600); flex-shrink: 0;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                    <span style="font-weight: 500;">${escapeHtml(brgyName)}</span>
                                </div>
                            </td>
                            <td>
                                <span style="font-weight: 500; color: var(--text);">${escapeHtml(dateFormatted)}</span>
                            </td>
                            <td>
                                <span style="font-size: 12.5px; color: var(--text);">${escapeHtml(timeRange)}</span>
                            </td>
                            <td>
                                ${statusPill}
                            </td>
                            <td style="text-align: center;">
                                <button type="button" 
                                        class="action-icon-btn has-tooltip" 
                                        data-tooltip="View Report" 
                                        aria-label="View Report for ${escapeHtml(driverName)}" 
                                        onclick="viewReportDetails(${report.id})">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 24px; color: #dc2626;">Unable to load reports: ${escapeHtml(error.message)}</td></tr>`;
            }
        }

        function viewReportDetails(id) {
            const report = recentReportsData.find(r => r.id === id);
            if (!report) return;

            const driverName = report.truck?.driver?.name || 'Driver not assigned';
            const truckNumber = report.truck?.truck_number || 'Truck not assigned';
            const plateNumber = report.truck?.plate_number || 'Plate not recorded';
            const barangayName = report.barangay?.name || 'Barangay not recorded';
            const dateFormatted = report.collection_date ? report.collection_date.substring(0, 10) : '-';
            const startTime = report.start_time ? formatTime12(report.start_time) : '-';
            const endTime = report.end_time ? formatTime12(report.end_time) : '-';
            const timeRange = (startTime !== '-' || endTime !== '-') ? `${startTime} - ${endTime}` : '-';
            const statusPill = getStatusPillHtml(report.status);

            const body = document.getElementById('report-modal-body');
            body.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--surface-alt); padding: 14px; border-radius: 8px; border: 1px solid var(--border);">
                    <div>
                        <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Driver</span>
                        <div style="font-weight: 700; color: var(--text); font-size: 13.5px; margin-top: 2px;">${escapeHtml(driverName)}</div>
                    </div>
                    <div>
                        <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Truck & Plate</span>
                        <div style="font-weight: 600; color: var(--text); font-size: 13px; margin-top: 2px;">${escapeHtml(truckNumber)} (${escapeHtml(plateNumber)})</div>
                    </div>
                    <div>
                        <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Location / Barangay</span>
                        <div style="font-weight: 600; color: var(--text); font-size: 13px; margin-top: 2px;">${escapeHtml(barangayName)}</div>
                    </div>
                    <div>
                        <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Status</span>
                        <div style="margin-top: 3px;">${statusPill}</div>
                    </div>
                    <div>
                        <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Date</span>
                        <div style="font-weight: 600; color: var(--text); font-size: 13px; margin-top: 2px;">${escapeHtml(dateFormatted)}</div>
                    </div>
                    <div>
                        <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Time Window</span>
                        <div style="font-weight: 600; color: var(--text); font-size: 13px; margin-top: 2px;">${escapeHtml(timeRange)}</div>
                    </div>
                </div>
                ${report.notes ? `
                    <div>
                        <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Notes & Remarks</span>
                        <div style="margin-top: 4px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; color: var(--text);">
                            ${escapeHtml(report.notes)}
                        </div>
                    </div>
                ` : ''}
            `;

            document.getElementById('report-modal-title').textContent = `Report #${report.id} · ${barangayName}`;
            document.getElementById('report-modal').classList.add('active');
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.remove('active');
        }

        async function loadBarangays() {
            try {
                const res = await apiRequest('/barangays');
                barangays = res.barangays || [];
                const select = document.getElementById('barangay_id');
                select.innerHTML = '<option value="">Select Barangay</option>';
                const seen = new Set();
                barangays.forEach(b => {
                    if (!seen.has(b.name)) {
                        seen.add(b.name);
                        const opt = document.createElement('option');
                        opt.value = b.id;
                        opt.textContent = b.name;
                        select.appendChild(opt);
                    }
                });
            } catch (error) {
                console.error('Failed to load barangays', error);
            }
        }

        async function loadData() {
            try {
                const res = await apiRequest(endpoint);
                const data = res.schedules || [];
                schedules = data;
                renderCalendar();
            } catch (error) {
                document.getElementById('schedule-calendar').innerHTML = `<p class="empty-state">Unable to load calendar: ${error.message}</p>`;
            }
        }

        function openModal() {
            document.getElementById('form-modal').classList.add('active');
            document.getElementById('modal-title').textContent = 'Add Schedule';
            document.getElementById('data-form').reset();
            document.getElementById('item-id').value = '';
        }

        function closeModal() {
            document.getElementById('form-modal').classList.remove('active');
        }

        function editItem(item) {
            openModal();
            document.getElementById('modal-title').textContent = 'Edit Schedule';
            document.getElementById('item-id').value = item.id;
            document.getElementById('barangay_id').value = item.barangay_id || '';
            document.getElementById('date').value = item.date ? item.date.substring(0, 10) : '';
            document.getElementById('pickup_time').value = item.pickup_time ? item.pickup_time.substring(0, 5) : '';
            document.getElementById('status').value = item.status || 'scheduled';
            document.getElementById('notes').value = item.notes || '';
            document.getElementById('active').checked = !!item.active;
        }

        async function deleteItem(id) {
            if(!confirm('Are you sure you want to delete this schedule?')) return;
            try {
                await apiRequest(`${endpoint}/${id}`, 'DELETE');
                loadData();
            } catch(e) {
                alert('Error deleting: ' + e.message);
            }
        }

        document.getElementById('data-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const payload = {
                barangay_id: document.getElementById('barangay_id').value,
                date: document.getElementById('date').value,
                pickup_time: document.getElementById('pickup_time').value,
                notes: document.getElementById('notes').value,
                active: document.getElementById('active').checked,
                status: document.getElementById('status').value,
            };

            try {
                if (id) {
                    await apiRequest(`${endpoint}/${id}`, 'PUT', payload);
                } else {
                    await apiRequest(endpoint, 'POST', payload);
                }
                closeModal();
                loadData();
            } catch(e) {
                alert('Error saving: ' + e.message);
            }
        });

        window.addEventListener('click', (e) => {
            const formModal = document.getElementById('form-modal');
            if (e.target === formModal) closeModal();
            const reportModal = document.getElementById('report-modal');
            if (e.target === reportModal) closeReportModal();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closeReportModal();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadBarangays();
            loadData();
            loadRecentAdminReports();
        });
    </script>
</body>
</html>
