<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profiles - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            margin: 2px;
            border-radius: 12px;
            background: #eaf2fb;
            color: #2c3e50;
            font-size: 12px;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .filter-bar select, .filter-bar input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .checkbox-list label {
            display: block;
            font-weight: normal;
            margin-bottom: 6px;
        }
        .checkbox-list input {
            width: auto;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>All User Profiles</h2>
                <div id="topbar-user"></div>
            </header>
            
            <section class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>Users (Residents, Vendors, Drivers, Inspectors, Staff)</h3>
                    </div>
                    <div class="filter-bar">
                        <select id="role-filter">
                            <option value="">All Roles</option>
                        </select>
                        <input type="text" id="search-box" placeholder="Search by name or email...">
                        <button class="btn" onclick="loadData()" style="width: auto;">Search</button>
                    </div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Roles</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr><td colspan="6">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Profile + Permissions Modal -->
    <div id="form-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit User</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="data-form">
                <input type="hidden" id="item-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>New Password (leave blank to keep current)</label>
                    <input type="password" id="password" class="form-control">
                </div>
                <div class="form-group">
                    <label>Permissions / Roles</label>
                    <div class="checkbox-list" id="roles-checklist"></div>
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const endpoint = '/users';
        let allRoles = [];

        async function loadRoles() {
            try {
                const res = await apiRequest('/roles');
                allRoles = res.roles || [];

                const filterSelect = document.getElementById('role-filter');
                allRoles.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r.name;
                    opt.textContent = r.name;
                    filterSelect.appendChild(opt);
                });
            } catch (error) {
                console.error('Failed to load roles', error);
            }
        }

        async function loadData() {
            const tbody = document.getElementById('table-body');
            const role = document.getElementById('role-filter').value;
            const search = document.getElementById('search-box').value;

            let query = [];
            if (role) query.push(`role=${encodeURIComponent(role)}`);
            if (search) query.push(`search=${encodeURIComponent(search)}`);
            const qs = query.length ? `?${query.join('&')}` : '';

            try {
                const res = await apiRequest(endpoint + qs);
                const data = res.users || [];

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No users found.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => {
                    const roleBadges = (item.roles || []).map(r => `<span class="role-badge">${r.name}</span>`).join('');
                    const joined = item.created_at ? item.created_at.substring(0, 10) : '-';
                    return `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.email}</td>
                        <td>${roleBadges || '-'}</td>
                        <td>${joined}</td>
                        <td>
                            ${getUserRole() === 'super_admin' || !(item.roles || []).some(role => role.name === 'super_admin') ? `<button class="btn" style="padding: 5px 10px; width: auto; background: #f39c12;" onclick='editItem(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Edit</button>` : '<span class="protected-user">Protected</span>'}
                            ${getUserRole() === 'super_admin' ? `<button class="btn" style="padding: 5px 10px; width: auto; background: #e74c3c;" onclick="deleteItem(${item.id})">Delete</button>` : ''}
                        </td>
                    </tr>
                `;}).join('');
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="6">Error loading data: ${error.message}</td></tr>`;
            }
        }

        function renderRolesChecklist(userRoleIds) {
            const container = document.getElementById('roles-checklist');
            container.innerHTML = allRoles.map(r => `
                <label>
                    <input type="checkbox" value="${r.id}" ${userRoleIds.includes(r.id) ? 'checked' : ''}>
                    ${r.name}
                </label>
            `).join('');
        }

        function closeModal() {
            document.getElementById('form-modal').classList.remove('active');
        }

        function editItem(item) {
            document.getElementById('form-modal').classList.add('active');
            document.getElementById('item-id').value = item.id;
            document.getElementById('name').value = item.name;
            document.getElementById('email').value = item.email;
            document.getElementById('password').value = '';
            const userRoleIds = (item.roles || []).map(r => r.id);
            renderRolesChecklist(userRoleIds);
        }

        async function deleteItem(id) {
            if(!confirm('Are you sure you want to delete this user? This cannot be undone.')) return;
            try {
                await apiRequest(`${endpoint}/${id}`, 'DELETE');
                loadData();
            } catch(e) {
                alert('Error deleting: ' + e.message);
            }
        }

        document.getElementById('data-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
            };
            const pwd = document.getElementById('password').value;
            if (pwd) payload.password = pwd;

            const roleIds = Array.from(document.querySelectorAll('#roles-checklist input:checked')).map(cb => parseInt(cb.value, 10));

            try {
                await apiRequest(`${endpoint}/${id}`, 'PUT', payload);
                await apiRequest(`${endpoint}/${id}/roles`, 'PUT', { role_ids: roleIds });
                closeModal();
                loadData();
            } catch(e) {
                alert('Error saving: ' + e.message);
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await loadRoles();
            loadData();
        });
    </script>
</body>
</html>
